version: '3.8'

services:
  database:
    image: postgres:16-alpine
    container_name: reservas-db
    environment:
     - POSTGRES_USER=reservas_user    
     - POSTGRES_PASSWORD=password123    
     - POSTGRES_DB=reservas_db      
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - reservas_network

  backend:
    build: .
    container_name: reservas-api
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: reservas_user
      DB_PASSWORD: password123
      DB_NAME: reservas_db
    ports:
      - "3000:3000"
    depends_on:
      - database
    networks:
      - reservas_network
    restart: on-failure

volumes:
  postgres_data:

networks:
  reservas_network:
    driver: bridge